name: Component build

on:
  pull_request:
    paths:
      - 'installer/**'
      - 'repair/**'
      - 'system-transaction/**'
      - 'ai-router/**'
      - 'meoarch-os/packages.x86_64'
      - 'scripts/acceptance/20-build-components.sh'
      - 'scripts/build-installer-app.sh'
      - '.github/workflows/component-build.yml'
  push:
    branches:
      - main
      - boot/live-grub-contracts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Installer + repair + transaction + AI router runtime
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 35
    env:
      HOME: /tmp/meo-ci-home

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel cmake ninja git extra-cmake-modules python bubblewrap \
            qt6-base qt6-declarative qt6-tools qt6-shadertools \
            kconfig kcoreaddons kguiaddons ki18n kirigami \
            networkmanager-qt bluez-qt solid pulseaudio-qt \
            libplasma plasma-workspace qtkeychain-qt6 polkit-qt6
          mkdir -p "$HOME"

      - name: Check out workspace
        uses: actions/checkout@v6

      - name: Check out MeoUI
        uses: actions/checkout@v6
        with:
          repository: QwQdoge/MeoUI
          ref: main
          path: deps/meo-ui

      - name: Check out MeoKDE
        uses: actions/checkout@v6
        with:
          repository: QwQdoge/meo-kde
          ref: main
          path: deps/meo-kde

      - name: Provide sibling project layout
        run: |
          ln -sfn "$PWD/deps/meo-ui" ../meo-ui
          ln -sfn "$PWD/deps/meo-kde" ../meo-kde
          test -f ../meo-ui/CMakeLists.txt
          test -f ../meo-kde/native/system/CMakeLists.txt

      - name: Build installer and shared runtimes
        env:
          MEOARCH_OUTPUT_ROOT: ${{ github.workspace }}/build/ci-output
          MEOARCH_RUN_DIR: ${{ github.workspace }}/build/ci-output/validation/component-build
        run: scripts/acceptance/20-build-components.sh

      - name: Build and test system transaction service
        run: |
          cmake --fresh -S system-transaction -B build/system-transaction \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/system-transaction --parallel 2
          ctest --test-dir build/system-transaction --output-on-failure --timeout 30
          DESTDIR="$PWD/build/system-transaction-root" \
            cmake --install build/system-transaction --prefix /usr
          test -x build/system-transaction-root/usr/lib/meo-system-transaction/meo-system-transaction-service
          test -f build/system-transaction-root/usr/share/dbus-1/system.d/org.meo.SystemTransaction1.conf
          test -f build/system-transaction-root/usr/share/dbus-1/system-services/org.meo.SystemTransaction1.service
          test -f build/system-transaction-root/usr/lib/systemd/system/meo-system-transaction.service

      - name: Build and test system AI router
        run: |
          cmake --fresh -S ai-router -B build/ai-router \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/ai-router --parallel 2
          ctest --test-dir build/ai-router --output-on-failure --timeout 30

      - name: Configure installer controller tests
        run: >-
          cmake --fresh -S installer/tests/controller -B build/installer-controller
          -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build installer controller tests
        run: cmake --build build/installer-controller --parallel 2

      - name: Test installer controller lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          id -u live >/dev/null 2>&1 || useradd --system --create-home live
          ctest --test-dir build/installer-controller --output-on-failure --timeout 60
