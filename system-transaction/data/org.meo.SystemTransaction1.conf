<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.meo.SystemTransaction1"/>
  </policy>

  <!-- v0.1 exposes Inspect only. It is deliberately read-only and may be
       called by unprivileged desktop clients. Future mutating methods require
       a separate Polkit-authorized policy boundary before they are exposed. -->
  <policy context="default">
    <allow send_destination="org.meo.SystemTransaction1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
    <allow send_destination="org.meo.SystemTransaction1"
           send_interface="org.freedesktop.DBus.Peer"
           send_member="Ping"/>
    <allow send_destination="org.meo.SystemTransaction1"
           send_interface="org.meo.SystemTransaction1"
           send_member="Inspect"/>
  </policy>
</busconfig>
