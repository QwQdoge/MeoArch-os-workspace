LABEL arch
TEXT HELP
Boot the MeoArch OS install medium on BIOS.
It allows you to install MeoArch OS or perform system maintenance.
ENDTEXT
MENU LABEL ✨ Start MeoArch OS Installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the MeoArch OS install medium on BIOS with speakup screen reader.
It allows you to install MeoArch OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL MeoArch OS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
