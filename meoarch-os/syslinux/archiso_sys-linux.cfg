LABEL arch
TEXT HELP
Open the full-screen MeoArch installer on BIOS.
This option installs MeoArch OS to a selected disk.
ENDTEXT
MENU LABEL ^Install MeoArch OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% meoarch.mode=install quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 plymouth.enable=1

LABEL archrepair
TEXT HELP
Open the full-screen MeoArch Quick Repair app on BIOS.
Login and AI are optional; write actions require exact user confirmation.
ENDTEXT
MENU LABEL ^Repair MeoArch OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% meoarch.mode=repair quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 plymouth.enable=1

# Accessibility boot option
LABEL archspeech
TEXT HELP
Open the MeoArch installer on BIOS with the speakup screen reader.
ENDTEXT
MENU LABEL Install with ^speech reader (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% meoarch.mode=install accessibility=on
