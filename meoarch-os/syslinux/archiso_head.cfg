SERIAL 0 115200
UI vesamenu.c32
MENU TITLE MeoArch OS
MENU BACKGROUND splash.png

MENU WIDTH 64
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 9
MENU TABMSGROW 15
MENU CMDLINEROW 15
MENU HELPMSGROW 17
MENU HELPMSGENDROW 29

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32

# Match the UEFI theme: light surface, charcoal text, one purple selected row.
MENU COLOR border       0       #00000000 #00000000 none
MENU COLOR title        1;37    #ff1d192b #00000000 std
MENU COLOR sel          0       #ffffffff #ff6750a4 all
MENU COLOR unsel        0       #ff49454f #00000000 std
MENU COLOR help         0       #ff49454f #00000000 std
MENU COLOR timeout_msg  0       #ff49454f #00000000 std
MENU COLOR timeout      1       #ff6750a4 #00000000 std
MENU COLOR msg07        0       #ff49454f #00000000 std
MENU COLOR tabmsg       0       #ff49454f #00000000 std

MENU CLEAR
MENU IMMEDIATE
