[Unit]
# tty1 belongs to Cage during normal graphical Live modes. Only expose the
# classic ArchISO-style shell when the boot loader explicitly requests the
# console-only mode.
ConditionKernelCommandLine=meoarch.mode=console

[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root - ${TERM}
