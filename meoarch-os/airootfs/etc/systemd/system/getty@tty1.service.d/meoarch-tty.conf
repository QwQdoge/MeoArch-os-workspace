[Unit]
# Cage owns tty1 during graphical install/repair. The normal Arch-style console
# is available only when the bootloader explicitly selects meoarch.mode=tty.
ConditionKernelCommandLine=meoarch.mode=tty

[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root - ${TERM}
TTYVTDisallocate=no
